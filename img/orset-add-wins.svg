<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="828" viewBox="0 0 1080 828" role="img" aria-label="OR-Set, gana add: Node B recibe Xbox de Node A; después, a la vez, Node A borra Xbox y Node B lo agrega. El remove de Node A solo observó nodeA:1, así que nodeB:1 sigue vivo y los dos nodos quedan con {Xbox}.">
  <rect width="1080" height="828" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="prop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">
    <text x="260" y="40">Node A</text>
    <text x="820" y="40">Node B</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="260" y1="180" x2="260" y2="398" marker-end="url(#arrow)"/>
    <line x1="260" y1="534" x2="260" y2="586" marker-end="url(#arrow)"/>
    <line x1="820" y1="346" x2="820" y2="398" marker-end="url(#arrow)"/>
    <line x1="820" y1="512" x2="820" y2="586" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#0969da" stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="490" y1="125" x2="586" y2="291" marker-end="url(#prop)"/>
    <line x1="590" y1="457" x2="494" y2="645" marker-end="url(#prop)"/>
    <line x1="490" y1="468" x2="586" y2="645" marker-end="url(#prop)"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1f2328">
    <rect x="30" y="70" width="460" height="110" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="96" font-weight="bold">add(&#x27;Xbox&#x27;, &#x27;nodeA&#x27;)</text>
    <text x="46" y="124" xml:space="preserve">adds        Xbox → {<tspan fill="#1a7f37" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="46" y="146" xml:space="preserve" opacity="0.35">removes     <tspan fill="#8c959f">(vacío)</tspan></text>
    <text x="46" y="168" xml:space="preserve">value()     {Xbox}</text>
    <rect x="590" y="236" width="460" height="110" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="606" y="262" font-weight="bold">recibe de Node A (aplica join)</text>
    <text x="606" y="290" xml:space="preserve">adds        Xbox → {<tspan fill="#1a7f37" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="606" y="312" xml:space="preserve" opacity="0.35">removes     <tspan fill="#8c959f">(vacío)</tspan></text>
    <text x="606" y="334" xml:space="preserve">value()     {Xbox}</text>
    <rect x="30" y="402" width="460" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="428" font-weight="bold">remove(&#x27;Xbox&#x27;)</text>
    <text x="46" y="456" xml:space="preserve"><tspan fill="#57606a" font-style="italic">observó     Xbox → {<tspan font-weight="bold">nodeA:1</tspan>}</tspan></text>
    <text x="46" y="478" xml:space="preserve">adds        Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="46" y="500" xml:space="preserve">removes     Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="46" y="522" xml:space="preserve">value()     {}</text>
    <rect x="590" y="402" width="460" height="110" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="606" y="428" font-weight="bold">add(&#x27;Xbox&#x27;, &#x27;nodeB&#x27;)</text>
    <text x="606" y="456" xml:space="preserve">adds        Xbox → {<tspan fill="#1a7f37" font-weight="bold">nodeA:1</tspan>, <tspan fill="#1a7f37" font-weight="bold">nodeB:1</tspan>}</text>
    <text x="606" y="478" xml:space="preserve" opacity="0.35">removes     <tspan fill="#8c959f">(vacío)</tspan></text>
    <text x="606" y="500" xml:space="preserve" opacity="0.35">value()     {Xbox}</text>
    <rect x="30" y="590" width="460" height="110" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="616" font-weight="bold">recibe de Node B (aplica join)</text>
    <text x="46" y="644" xml:space="preserve">adds        Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>, <tspan fill="#1a7f37" font-weight="bold">nodeB:1</tspan>}</text>
    <text x="46" y="666" xml:space="preserve" opacity="0.35">removes     Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="46" y="688" xml:space="preserve">value()     {Xbox}</text>
    <rect x="590" y="590" width="460" height="110" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="606" y="616" font-weight="bold">recibe de Node A (aplica join)</text>
    <text x="606" y="644" xml:space="preserve">adds        Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>, <tspan fill="#1a7f37" font-weight="bold">nodeB:1</tspan>}</text>
    <text x="606" y="666" xml:space="preserve">removes     Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="606" y="688" xml:space="preserve" opacity="0.35">value()     {Xbox}</text>
    <text x="540" y="670" text-anchor="middle" font-size="22" font-weight="bold" fill="#57606a">=</text>
    <text x="540" y="690" text-anchor="middle" font-size="12" fill="#57606a">mismo estado</text>
    <text x="540" y="730" text-anchor="middle" font-style="italic" fill="#57606a">El remove de Node A solo canceló lo que observó (nodeA:1): el add concurrente de Node B gana.</text>
    <rect x="30" y="759" width="14" height="14" rx="3" fill="#1a7f37"/>
    <text x="52" y="770">tag de add vivo</text>
    <rect x="208.0" y="759" width="14" height="14" rx="3" fill="#8c959f"/>
    <text x="230.0" y="770">tag cancelado (está en removes)</text>
    <text x="520.4000000000001" y="770" opacity="0.35">abc</text>
    <text x="558.4000000000001" y="770">no cambió en este paso</text>
    <line x1="773.2" y1="766" x2="803.2" y2="766" stroke="#57606a" stroke-width="1.5"/>
    <text x="811.2" y="770">update local</text>
    <line x1="30" y1="794" x2="60" y2="794" stroke="#0969da" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="68" y="798">propagación: el nodo aplica join del estado recibido</text>
  </g>
</svg>
