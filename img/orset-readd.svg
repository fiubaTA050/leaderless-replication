<svg xmlns="http://www.w3.org/2000/svg" width="520" height="662" viewBox="0 0 520 662" role="img" aria-label="OR-Set, volver a agregar: Node A agrega Xbox, lo borra y lo vuelve a agregar. El remove canceló nodeA:1; el segundo add crea un tag nuevo, nodeA:2, que está vivo.">
  <rect width="520" height="662" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="prop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">
    <text x="260" y="40">Node A</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="260" y1="180" x2="260" y2="232" marker-end="url(#arrow)"/>
    <line x1="260" y1="368" x2="260" y2="420" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#0969da" stroke-width="1.5" stroke-dasharray="6 4">
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1f2328">
    <rect x="30" y="70" width="460" height="110" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="96" font-weight="bold">add(&#x27;Xbox&#x27;, &#x27;nodeA&#x27;)</text>
    <text x="46" y="124" xml:space="preserve">adds        Xbox → {<tspan fill="#1a7f37" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="46" y="146" xml:space="preserve" opacity="0.35">removes     <tspan fill="#8c959f">(vacío)</tspan></text>
    <text x="46" y="168" xml:space="preserve">value()     {Xbox}</text>
    <rect x="30" y="236" width="460" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="262" font-weight="bold">remove(&#x27;Xbox&#x27;)</text>
    <text x="46" y="290" xml:space="preserve"><tspan fill="#57606a" font-style="italic">observó     Xbox → {<tspan font-weight="bold">nodeA:1</tspan>}</tspan></text>
    <text x="46" y="312" xml:space="preserve">adds        Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="46" y="334" xml:space="preserve">removes     Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="46" y="356" xml:space="preserve">value()     {}</text>
    <rect x="30" y="424" width="460" height="110" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="450" font-weight="bold">add(&#x27;Xbox&#x27;, &#x27;nodeA&#x27;)</text>
    <text x="46" y="478" xml:space="preserve">adds        Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>, <tspan fill="#1a7f37" font-weight="bold">nodeA:2</tspan>}</text>
    <text x="46" y="500" xml:space="preserve" opacity="0.35">removes     Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="46" y="522" xml:space="preserve">value()     {Xbox}</text>
    <text x="260" y="564" text-anchor="middle" font-style="italic" fill="#57606a">Cada add crea un tag nuevo: nadie canceló nodeA:2.</text>
    <rect x="30" y="593" width="14" height="14" rx="3" fill="#1a7f37"/>
    <text x="52" y="604">tag de add vivo</text>
    <rect x="208.0" y="593" width="14" height="14" rx="3" fill="#8c959f"/>
    <text x="230.0" y="604">tag cancelado</text>
    <text x="30" y="632" opacity="0.35">abc</text>
    <text x="68" y="632">no cambió en este paso</text>
    <line x1="282.8" y1="628" x2="312.8" y2="628" stroke="#57606a" stroke-width="1.5"/>
    <text x="320.8" y="632">update local</text>
  </g>
</svg>
