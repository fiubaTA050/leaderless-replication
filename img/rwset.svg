<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1166" viewBox="0 0 1080 1166" role="img" aria-label="RW-set, gana remove: la misma secuencia que el OR-Set. El add de Node A (nodeA:3) canceló el remove que vio (nodeA:2), pero no el de Node B (nodeB:1), que es concurrente: queda un tag de remove vivo y los dos nodos quedan con {PlayStation}.">
  <rect width="1080" height="1166" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="prop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">
    <text x="260" y="40">Node A</text>
    <text x="820" y="40">Node B</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="260" y1="202" x2="260" y2="442" marker-end="url(#arrow)"/>
    <line x1="260" y1="578" x2="260" y2="630" marker-end="url(#arrow)"/>
    <line x1="260" y1="766" x2="260" y2="862" marker-end="url(#arrow)"/>
    <line x1="820" y1="390" x2="820" y2="442" marker-end="url(#arrow)"/>
    <line x1="820" y1="578" x2="820" y2="630" marker-end="url(#arrow)"/>
    <line x1="820" y1="810" x2="820" y2="862" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#0969da" stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="490" y1="136" x2="586" y2="313" marker-end="url(#prop)"/>
    <line x1="490" y1="700" x2="586" y2="921" marker-end="url(#prop)"/>
    <line x1="590" y1="722" x2="494" y2="921" marker-end="url(#prop)"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1f2328">
    <rect x="30" y="70" width="460" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="96" font-weight="bold">add(&#x27;Xbox&#x27;, &#x27;nodeA&#x27;)</text>
    <text x="46" y="124" xml:space="preserve">adds        Xbox → {<tspan fill="#1a7f37" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="46" y="146" xml:space="preserve" opacity="0.35">removes     <tspan fill="#8c959f">(vacío)</tspan></text>
    <text x="46" y="168" xml:space="preserve">tombstones  Xbox → {}</text>
    <text x="46" y="190" xml:space="preserve">value()     {Xbox}</text>
    <rect x="590" y="258" width="460" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="606" y="284" font-weight="bold">recibe de Node A (aplica join)</text>
    <text x="606" y="312" xml:space="preserve">adds        Xbox → {<tspan fill="#1a7f37" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="606" y="334" xml:space="preserve" opacity="0.35">removes     <tspan fill="#8c959f">(vacío)</tspan></text>
    <text x="606" y="356" xml:space="preserve">tombstones  Xbox → {}</text>
    <text x="606" y="378" xml:space="preserve">value()     {Xbox}</text>
    <rect x="30" y="446" width="460" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="472" font-weight="bold">remove(&#x27;Xbox&#x27;, &#x27;nodeA&#x27;)</text>
    <text x="46" y="500" xml:space="preserve">adds        Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="46" y="522" xml:space="preserve">removes     Xbox → {<tspan fill="#cf222e" font-weight="bold">nodeA:2</tspan>}</text>
    <text x="46" y="544" xml:space="preserve">tombstones  Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="46" y="566" xml:space="preserve">value()     {}</text>
    <rect x="590" y="446" width="460" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="606" y="472" font-weight="bold">remove(&#x27;Xbox&#x27;, &#x27;nodeB&#x27;)</text>
    <text x="606" y="500" xml:space="preserve">adds        Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="606" y="522" xml:space="preserve">removes     Xbox → {<tspan fill="#cf222e" font-weight="bold">nodeB:1</tspan>}</text>
    <text x="606" y="544" xml:space="preserve">tombstones  Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="606" y="566" xml:space="preserve">value()     {}</text>
    <rect x="30" y="634" width="460" height="132" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="660" font-weight="bold">add(&#x27;Xbox&#x27;, &#x27;nodeA&#x27;)</text>
    <text x="46" y="688" xml:space="preserve">adds        Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>, <tspan fill="#1a7f37" font-weight="bold">nodeA:3</tspan>}</text>
    <text x="46" y="710" xml:space="preserve">removes     Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:2</tspan>}</text>
    <text x="46" y="732" xml:space="preserve">tombstones  Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>, <tspan fill="#8c959f" font-weight="bold">nodeA:2</tspan>}</text>
    <text x="46" y="754" xml:space="preserve">value()     {Xbox}</text>
    <rect x="590" y="634" width="460" height="176" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="606" y="660" font-weight="bold">add(&#x27;PlayStation&#x27;, &#x27;nodeB&#x27;)</text>
    <text x="606" y="688" xml:space="preserve" opacity="0.35">adds        Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="606" y="710" xml:space="preserve">            PlayStation → {<tspan fill="#1a7f37" font-weight="bold">nodeB:1</tspan>}</text>
    <text x="606" y="732" xml:space="preserve" opacity="0.35">removes     Xbox → {<tspan fill="#cf222e" font-weight="bold">nodeB:1</tspan>}</text>
    <text x="606" y="754" xml:space="preserve" opacity="0.35">tombstones  Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>}</text>
    <text x="606" y="776" xml:space="preserve">            PlayStation → {}</text>
    <text x="606" y="798" xml:space="preserve">value()     {PlayStation}</text>
    <rect x="30" y="866" width="460" height="176" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="892" font-weight="bold">recibe de Node B (aplica join)</text>
    <text x="46" y="920" xml:space="preserve" opacity="0.35">adds        Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>, <tspan fill="#1a7f37" font-weight="bold">nodeA:3</tspan>}</text>
    <text x="46" y="942" xml:space="preserve">            PlayStation → {<tspan fill="#1a7f37" font-weight="bold">nodeB:1</tspan>}</text>
    <text x="46" y="964" xml:space="preserve">removes     Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:2</tspan>, <tspan fill="#cf222e" font-weight="bold">nodeB:1</tspan>}</text>
    <text x="46" y="986" xml:space="preserve" opacity="0.35">tombstones  Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>, <tspan fill="#8c959f" font-weight="bold">nodeA:2</tspan>}</text>
    <text x="46" y="1008" xml:space="preserve">            PlayStation → {}</text>
    <text x="46" y="1030" xml:space="preserve">value()     {PlayStation}</text>
    <rect x="590" y="866" width="460" height="176" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="606" y="892" font-weight="bold">recibe de Node A (aplica join)</text>
    <text x="606" y="920" xml:space="preserve">adds        Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>, <tspan fill="#1a7f37" font-weight="bold">nodeA:3</tspan>}</text>
    <text x="606" y="942" xml:space="preserve" opacity="0.35">            PlayStation → {<tspan fill="#1a7f37" font-weight="bold">nodeB:1</tspan>}</text>
    <text x="606" y="964" xml:space="preserve">removes     Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:2</tspan>, <tspan fill="#cf222e" font-weight="bold">nodeB:1</tspan>}</text>
    <text x="606" y="986" xml:space="preserve">tombstones  Xbox → {<tspan fill="#8c959f" font-weight="bold">nodeA:1</tspan>, <tspan fill="#8c959f" font-weight="bold">nodeA:2</tspan>}</text>
    <text x="606" y="1008" xml:space="preserve" opacity="0.35">            PlayStation → {}</text>
    <text x="606" y="1030" xml:space="preserve" opacity="0.35">value()     {PlayStation}</text>
    <text x="540" y="958" text-anchor="middle" font-size="22" font-weight="bold" fill="#57606a">=</text>
    <text x="540" y="978" text-anchor="middle" font-size="12" fill="#57606a">mismo estado</text>
    <text x="540" y="1072" text-anchor="middle" font-style="italic" fill="#57606a">Gana remove: el add nodeA:3 no vio el remove concurrente nodeB:1, que sigue vivo.</text>
    <rect x="30" y="1101" width="14" height="14" rx="3" fill="#1a7f37"/>
    <text x="52" y="1112">tag de add vivo</text>
    <rect x="208" y="1101" width="14" height="14" rx="3" fill="#cf222e"/>
    <text x="230" y="1112">tag de remove vivo</text>
    <rect x="411.20000000000005" y="1101" width="14" height="14" rx="3" fill="#8c959f"/>
    <text x="433.20000000000005" y="1112">tag cancelado (en tombstones)</text>
    <text x="706.8000000000001" y="1112" opacity="0.35">abc</text>
    <text x="744.8000000000001" y="1112">no cambió en este paso</text>
    <line x1="30" y1="1132" x2="60" y2="1132" stroke="#57606a" stroke-width="1.5"/>
    <text x="68" y="1136">update local</text>
    <line x1="198.8" y1="1132" x2="228.8" y2="1132" stroke="#0969da" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="236.8" y="1136">propagación: el nodo aplica join del estado recibido</text>
  </g>
</svg>
