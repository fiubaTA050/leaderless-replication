# Sirve la página y reenvía /riak/ a la HTTP API de Riak: mismo origen, así el browser no necesita CORS
server {
  listen 80;
  root /usr/share/nginx/html;

  # DNS de Docker. Con el upstream en una variable, nginx resuelve "riak" en cada request y no al arrancar: la UI
  # arranca aunque Riak todavía no esté listo
  resolver 127.0.0.11 valid=10s;
  set $riak http://riak:8098;

  location /riak/ {
    rewrite ^/riak/(.*)$ /$1 break;
    proxy_pass $riak;
    # Riak rechaza con 403 los requests con un Referer de otro host (secure_referer_check)
    proxy_set_header Referer "";
  }
}
